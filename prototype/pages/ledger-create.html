<!doctype html>
<html lang="zh-CN">
<head>

<title>新建账本 · beancount-gs 原型</title>
<link rel="stylesheet" href="../assets/wireframe.css">
</head>
<body>
<div class="wf-wrap">
  <div class="wf-top">
    <a class="wf-brand" href="../index.html"><span class="wf-logo"></span>beancount-gs 原型</a>
    <nav class="wf-crumb">
      <a href="workspaces.html">工作区</a> / <a href="ledgers.html">账本</a> / <span>新建账本</span>
    </nav>
    <div class="wf-user"><span class="wf-avatar"></span><span>GitHub 用户</span></div>

  <div class="wf-auth">
    <div class="wf-auth-card">
      <h2>新建账本</h2>
      <span class="wf-note">按模板初始化 beancount 账本文件结构</span>
      <div class="wf-grid wf-grid-2">
        <div class="wf-box"><b>账本名称</b><span class="wf-note">家庭账本</span></div>

      <div class="wf-toolbar">
        <a class="wf-btn" href="ledgers.html">取消</a>
        <a class="wf-btn wf-btn-primary" href="dashboard.html">创建账本</a>

      <span class="wf-note">创建后自动生成 index.bean / month / account / price / event 目录</span>
