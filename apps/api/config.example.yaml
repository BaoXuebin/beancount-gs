# beancount-gs 服务配置示例：复制为 config.yaml 后按需修改
port: 10000
db_path: data/beancount-gs.db
data_root: data
template_dir: ../../template
public_url: http://localhost:10000
# 登录成功后的跳转地址：开发模式填前端 http://localhost:5173；
# 生产环境同域部署时留空即可（默认跟随 public_url）
frontend_url: http://localhost:5173
session_cookie: bgs_session
oauth_state_cookie: bgs_oauth_state

# 出站 HTTP 代理（可选）：访问 GitHub / AI 服务超时时使用，
# 例如本地代理 http://127.0.0.1:7890
http_proxy: ""

# GitHub OAuth（回调地址为 public_url + /api/v2/auth/github/callback）
github_client_id: ""
github_client_secret: ""

# AI（可选；provider: openai | compatible | ollama | deepseek）
# 示例（DeepSeek）：
#   ai_provider: deepseek
#   ai_api_key: sk-xxx
#   ai_model: deepseek-chat
#   # ai_base_url 可省略（默认 https://api.deepseek.com/v1）
ai_provider: ""
ai_api_key: ""
ai_model: ""
ai_base_url: ""
